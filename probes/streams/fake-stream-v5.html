<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>FA-v5 — G1 plant + inversion + garbage-typing (dshv5 design)</title></head>

 function poisonOverYieldFirst(){ return function(){ var arr=this,i=0,n=arr.length+1;
   return { next:function(){ if(i>=n) return {done:true}; var v=(i<arr.length)?arr[i]:{}; i++; return {value:v, done:false}; } }; }; }
 function poisonUnderYieldOne(){ return function(){ var arr=this,i=0,n=(arr.length>=2)?1:arr.length;
   return { next:function(){ if(i>=n) return {done:true}; i++; return {value:{fake:0}, done:false}; } }; }; }
 function poisonUnderYieldPlain(){ return function(){ var arr=this,i=0;
   return { next:function(){ if(i===1) return {done:true}; i++; return {value:0x1337, done:false}; } }; }; }

                       Array.prototype[Symbol.iterator] = poisonUnderYieldOne();
                       var pair2 = rs2.tee();
                       Array.prototype[Symbol.iterator] = origIter;
                       return pair2; }

     if (!(pair2[0] instanceof ReadableStream)) throw "pair2[0] not RS";
     return "fase2 returned; locked="+pair2[0].locked+"; gReader.t="+(typeof pair2[0].getReader);
   });
 // V-P1 private-name inversion (Date object)
 v("P1", "inversion [s1, Date]", poisonOverYieldFirst, function(){
   var rs = new ReadableStream({}); var pair = rs.tee();
   var d = new Date(); var myIt = { [Symbol.iterator]: function(){ var vals=[rs, d]; var i=0;
     return {next:function(){ if(i>=vals.length) return {done:true}; return {value:vals[i++], done:false}; }}; } };
   return "locked="+pair[0].locked+"; inversion-bit "+(d instanceof Date ? "consistent" : "inconsistent"); });
 // V-G1 garbage-typing: over-yield [s1, BigInt-wrapped Object]

   var big = Object(1234567890n);
   return "getReader.t="+(typeof pair[0].getReader)+"; locked="+pair[0].locked; });
