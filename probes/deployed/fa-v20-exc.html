<script>
(function(){

var RID="v20e"+Date.now().toString(36).slice(-13);
var out=document.getElementById("out");
function say(s){try{out.appendChild(document.createTextNode("\n"+s));}catch(e){}}
function bk(s,b){try{fetch("/beacon/V20-"+s,{method:"POST",cache:"no-store",keepalive:true,headers:{"Content-Type":"application/json"},body:JSON.stringify({r:RID,b:String(b).slice(0,500)})}).catch(function(){});}catch(e){}}

var OI=Array.prototype[Symbol.iterator];

function poi(a){Array.prototype[Symbol.iterator]=function(){var i=0;return{next:function(){if(i>=a.length)return{done:true};var v=a[i];i++;return{value:v,done:false};}};};}
function poiThrow(n){Array.prototype[Symbol.iterator]=function(){var i=0;return{next:function(){i++;if(i>n)throw new Error("POISON-THROW-MARKER");return{value:undefined,done:false};}};};}

/* op B inocente: stream fresco + enqueue(1) + close + read → debe resolver value=1 */
function innocent(tag, extra, done){
  var settled=false;
  function fin(s){ if(settled)return; settled=true; bk(tag,s); done&&done(); }
  try{
    var rs=new ReadableStream({start:function(c){ c.enqueue(1); c.close(); }});
    rs.getReader().read().then(function(r){
      fin("B="+(r&&r.value===1?"ok":"WEIRD:"+(r&&r.value))+extra);
    },function(err){
      fin("B=rej:"+String((err&&err.message)||err).slice(0,70)+extra);
    });
    setTimeout(function(){ fin("B=timeout"+extra); },600);
  }catch(e){ fin("B=E:"+String((e&&e.message)||e).slice(0,70)+extra); }
}

/* S1 — CONTROL: B sola (debe dar ok) */
innocent("S1","",function(){

/* S3 — A: iterador envenenado que TIRA en el 2º next() durante tee → B */
    var a3="-";

/* S4 — A: reader-ctor sobre objeto sustituido (la ruta rdX — write privado) → B */

        try{ new ReadableStreamDefaultReader(w4[0]); a4="no-throw"; }catch(e){ a4="threw:"+String((e&&e.message)||e).slice(0,40); }

      bk("S4A","A="+a4);

        var a5="-";

        }catch(e){ a5="E:"+String((e&&e.message)||e).slice(0,40); }
        bk("S5A","A="+a5);

          clearInterval(HB);
          bk("Z","FA-v20-exc complete; DR_OK="+(rt==="function")+(rt!=="function"?" DRGATE":""));
        });

    });
  });
});
