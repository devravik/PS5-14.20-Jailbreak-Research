<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>V522-V523 CE+Observer Re-entrancy</title>
</head>
<body>
<pre id="log">Loading probes...</pre>
<script>
var scripts = ['p522-ce-reentry.js', 'p523-observer-reentry.js'];
var idx = 0;
function loadNext() {
  if (idx >= scripts.length) {
    document.getElementById('log').textContent += '\nAll probes loaded. Auto-reload in 180s.';
    setTimeout(function(){ location.reload(); }, 180000);
    return;
  }
  var s = document.createElement('script');
  s.src = scripts[idx] + '?t=' + Date.now();
  s.onload = s.onerror = function() { idx++; loadNext(); };
  document.body.appendChild(s);
}
loadNext();
</script>
</body>
</html>
