<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="runtime-derive/derive-runtime.js"></script>
<script>(function(){try{var x=new XMLHttpRequest();x.open("GET","current.txt",false);x.send(null);var u=(x.responseText||"").trim();if(u&&location.href.indexOf(u.split("?")[0])===-1){location.replace(u);}}catch(e){}})();</script>
<title>FA-v42-woff — press-42: control WOFF1 store-mode (R2 exacto)</title></head>
<body><pre id="out">FA-v42-woff…</pre>
<script>
(function(){
"use strict";
/* FA-v42-woff — press-42: f40c2 = WOFF1 store-mode (compLength==origLength),
 * 10 tags ÚNICOS ordenados, offsets disjuntos, checksums reales.
 * Si CARGA → el camino wrapper-WOFF→FT existe → frontera 4096 medible vía f40x2.
 * Si rechaza → WOFF = policy-blocked en este build → cerramos WOFF.
 * f40x2 (4096 tabs, store) al final: wrapper lo debe frenar (gate 1..4095);
 * si CARGA = no hay wrapper → FT directo y el peaje es de FT (=versión). */
var RID="v42w"+Date.now().toString(36).slice(-13);
function bk(s,b){try{fetch("/beacon/"+s,{method:"POST",cache:"no-store",keepalive:true,headers:{"Content-Type":"application/json"},body:JSON.stringify({r:RID,b:String(b).slice(0,500)})}).catch(function(){});}catch(e){}}
var HB=setInterval(function(){bk("V42-HB","main-hb");},2000);
var dr="-",rt="-";
try{ dr=typeof window.deriveRuntime; rt=(dr==="object"&&window.deriveRuntime)?typeof window.deriveRuntime.run:"-"; }catch(e){}
bk("V42-L","v42-woff; dr="+dr+"; rt="+rt);
function Trnd(){ return Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function doLoad(id,f){
  bk("V42-E"+id,"enter-load "+id);
  try{
    var ff=new FontFace("v42-"+id,"url(/document/al/ps5/"+f+"?t="+Trnd()+")");
    document.fonts.add(ff);
    ff.load().then(function(){ bk("V42-R"+id,id+" load=OK status="+ff.status); },
                    function(err){ bk("V42-R"+id,id+" rechaza: "+String((err&&err.name)+" "+((err&&err.message)||"")).slice(0,55)); });
  }catch(e){ bk("V42-R"+id,id+" E:"+String((e&&e.message)||e).slice(0,50)); }
}
setTimeout(function(){ doLoad("c2","f40c2.woff"); }, 300);
setTimeout(function(){ doLoad("x2","f40x2.woff"); }, 1400);   /* LETHAL-LAST */
setTimeout(function(){ clearInterval(HB); bk("V42-Z","FA-v42-woff complete"); }, 5000);
setTimeout(function(){ clearInterval(HB); bk("V42-Z2","late-z(14s)"); }, 14000);
})();
</script></body></html>
