<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>V520-V521 Probe Chain</title>
</head>
<body>
<pre id="log">Loading probes...</pre>
<script>
var scripts = [
  'p520-deep-primitives.js',
  'p521-structure-spray.js',
  'p520-mse-reentry.js',
  'p516-anim-reentry.js',
  'p517-proxy-reentry.js'
];
var idx = 0;
function loadNext() {
  if (idx >= scripts.length) {
    document.getElementById('log').textContent += '\nAll probes loaded. Auto-reload in 180s.';
    setTimeout(function() { location.reload(); }, 180000);
    return;
  }
  var s = document.createElement('script');
  s.src = scripts[idx] + '?t=' + Date.now();
  s.onload = function() {
    document.getElementById('log').textContent += '\n' + scripts[idx] + ' loaded OK';
    idx++;
    setTimeout(loadNext, 15000);
  };
  s.onerror = function() {
    document.getElementById('log').textContent += '\n' + scripts[idx] + ' FAILED to load';
    idx++;
    setTimeout(loadNext, 1000);
  };
  document.getElementById('log').textContent += '\nLoading ' + scripts[idx] + '...';
  document.body.appendChild(s);
}
loadNext();
</script>
</body>
</html>
